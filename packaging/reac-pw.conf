# reac-pw conf — commented WORKED EXAMPLE, not a file the RPM installs.
#
# ONE daemon, N listeners (docs/design/specs/2026-08-20-reac-auto-spine.md §5,
# the openmixer tree), and NOTHING NAMES AN INTERFACE (the trunk-VLAN spec
# there, amendment 2026-09-02): packaging/reac-pw.service passes NO --live/
# --rate/--headamp at all, and the daemon HEARS its segments — every Ethernet
# interface with link is sniffed by a passive 0x8819 socket, the first REAC
# frame heard makes that interface a segment named after it, and link loss
# drops it after a 3 s hold. Every fact below is read at RUNTIME through
# reac_conf.h's layered lookup from this ONE file. Copy it to
# ~/.config/reac-pw/reac-pw.env and adjust the mixer/rate/head-amp table for
# your rig; leave the interface names to the daemon.
#
# See docs/RATE-AND-CLOCK-CONFIG.md for the full precedence law.

# ============================================================================
# ~/.config/reac-pw/reac-pw.env  — the one conf: host-wide keys, and one
# suffixed key per segment where a segment differs from the host.
# ============================================================================
#
# HOST-WIDE. What every segment shares. The box declares its own model and
# width, so nothing here describes the hardware.

REAC_MIXER=m5000
REAC_RATE=96000

# The ROLE, and since 0.5.0 you almost certainly do not want to set it.
#
# With nothing here the daemon RESOLVES the role per segment by listening
# (`auto`, arbitration spec S8b): a desk mastering the wire is joined as a
# slave, a wire with a box on it and no master is TAKEN as master and granted,
# and a stagebox strapped to master is refused with the remedy named. That is
# the product path and it needs no key.
#
# A BARE key here is a FLOOR for every segment on the host — it cannot know
# what is on any one wire, so the hunt supersedes it and says which layer it
# came from. This is what left two boxes ungranted on 2026-09-08: `slave` in
# this file described segments that had nothing to slave to. Only the
# per-segment key below OVERRIDES the wire.

# REAC_ROLE=auto

# PER-SEGMENT. A segment is named after its interface, and a per-segment fact
# is the key SUFFIXED with that name, resolved ABOVE the bare key in every
# layer (reac_conf.h). This rig's two segments:
#
#   REAC_ROLE_enp128s20f0u2=master     # REAC A — the S-1608 on the USB AX88179
#   REAC_ROLE_enp131s0=master          # REAC B — the S-4000S on the PCIe r8169
#
# REAC_TX_<segment> defaults to the interface itself (this rig's masters
# always tx == live). REAC_NAME_<segment> overrides the node suffix, which
# otherwise IS the interface name (reac-capture.enp131s0 / reac-playback
# .enp131s0) — it is the address the console's patches name, so changing it
# re-points every patch on that box. REAC_RATE_<segment> and
# REAC_MIXER_<segment> follow the same rule.
#
# REAC_HEADAMP_<segment> is a segment's head-amp re-assertion table — e.g. the
# S-1608's (sens 32, phantom on) across its CH 0x20..0x2f window, the 32
# individual --headamp flags of a hand-run master as ONE whitespace-separated
# conf value:
#
# REAC_HEADAMP_enp128s20f0u2="32:sens:32 32:phantom:1 33:sens:32 33:phantom:1 34:sens:32 34:phantom:1 35:sens:32 35:phantom:1 36:sens:32 36:phantom:1 37:sens:32 37:phantom:1 38:sens:32 38:phantom:1 39:sens:32 39:phantom:1 40:sens:32 40:phantom:1 41:sens:32 41:phantom:1 42:sens:32 42:phantom:1 43:sens:32 43:phantom:1 44:sens:32 44:phantom:1 45:sens:32 45:phantom:1 46:sens:32 46:phantom:1 47:sens:32 47:phantom:1"
