# reac-pw conf — commented WORKED EXAMPLE, not a file the RPM installs.
#
# ONE daemon, N listeners (docs/design/specs/2026-08-20-reac-auto-spine.md §5,
# the openmixer tree): packaging/reac-pw.service passes NO --live/--rate/
# --headamp at all. Every fact below is read at RUNTIME through reac_conf.h's
# layered lookup (unchanged by the auto-spine work — it was already generic
# key/value); this file just shows what to put where for THIS rig's two
# segments. Copy each labelled block into the named path under your own
# $HOME, adjusting the interface names/mixer/head-amp table for your rig.
#
# See docs/RATE-AND-CLOCK-CONFIG.md for the full precedence law and
# docs/RIG-MASTERS.txt for the verbatim hand-run command lines this conf
# shape replaces.

# ============================================================================
# ~/.config/reac-pw/reac-pw.env  — PER-HOST: what every segment shares.
# ============================================================================
#
# REAC_IFACES is the ONE config-once fact auto-spine names: which NIC(s) face
# REAC. A daemon started with no --live/--pcap at all (packaging/
# reac-pw.service's ExecStart) reads this list and opens one listener per
# entry, each then resolving its OWN settings from its own <iface>.env below.
# Comma or whitespace separated; order does not matter.

REAC_IFACES=enp128s20f0u2,enp131s0

# Each NIC named above takes its own ~/.config/reac-pw/<iface>.env, e.g.
#
#   # REAC B - the S-4000S on the PCIe r8169
#   REAC_TX=enp131s0
#   REAC_ROLE=master
#   REAC_MIXER=m5000
#   REAC_RATE=96000
#   REAC_NAME=seg2      # suffixes this segment's PipeWire nodes
#
# The box declares its own model and width, so nothing here describes the
# hardware. REAC_NAME is the address the console's patches name: changing it
# re-points every patch on that box.

# ============================================================================
# ~/.config/reac-pw/enp128s20f0u6.env  — PER-SEGMENT: this rig's segment A.
# ============================================================================
#
# No REAC_NAME: this is the FIRST interface REAC_IFACES lists, so it keeps
# BARE node names (reac-capture / reac-playback with no suffix) — the same
# default a lone `--live enp128s20f0u6` invocation has always had. REAC_TX
# defaults to the interface itself when unset (this rig's masters always
# tx == live), so it is not repeated here either.
#
# REAC_MIXER=m200
# REAC_RATE=48000

# ============================================================================
# ~/.config/reac-pw/enp131s0.env  — PER-SEGMENT: this rig's segment B (S-1608).
# ============================================================================
#
# REAC_NAME names the nodes reac-capture.s1608 / reac-playback.s1608 — every
# segment after the first defaults its name to its own interface if this is
# left unset, but the S-1608's hand-run master has always used "s1608"
# explicitly, so this file keeps saying so.
#
# REAC_NAME=s1608
# REAC_MIXER=m5000
# REAC_RATE=48000
#
# REAC_HEADAMP is the S-1608's re-assertion table (sens 32, phantom on)
# across its CH 0x20..0x2f window — the 32 individual --headamp flags
# docs/RIG-MASTERS.txt shows on the hand-run command line, as ONE
# whitespace-separated conf value instead:
#
# REAC_HEADAMP="32:sens:32 32:phantom:1 33:sens:32 33:phantom:1 34:sens:32 34:phantom:1 35:sens:32 35:phantom:1 36:sens:32 36:phantom:1 37:sens:32 37:phantom:1 38:sens:32 38:phantom:1 39:sens:32 39:phantom:1 40:sens:32 40:phantom:1 41:sens:32 41:phantom:1 42:sens:32 42:phantom:1 43:sens:32 43:phantom:1 44:sens:32 44:phantom:1 45:sens:32 45:phantom:1 46:sens:32 46:phantom:1 47:sens:32 47:phantom:1"
