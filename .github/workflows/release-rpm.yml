#
# Publish reac-pw into the SAME public dnf tree libreac's own equivalent
# workflow publishes into: FreeREAC/freereac.github.io, dir `rpm/` (operator
# ruling 2026-09-13, "everything public now" -- the private R2 worker this
# workflow used to pull/push through is RETIRED; there is one target, the
# public Pages tree, or the run is a dry run that publishes nothing). This
# workflow is reac-pw's own half of that publish, shaped after libreac's
# (read alongside packaging/publish-repo.sh, which this calls unmodified --
# a second copy of its placement/sign/createrepo logic would be a build
# whose drift nobody sees). publish-repo.sh's own defaults (repo id
# `freereac`, base URL `https://freereac.github.io/rpm`) ARE this tree's
# identity, so nothing here overrides them.
#
# ORDER: libreac's own release-rpm.yml MUST run and land BEFORE this one.
# reac-pw's BuildRequires includes pkgconfig(libreac) >= 0.7.1 (packaging/
# reac-pw.spec), a library Fedora does not carry -- it is resolved from the
# same public tree this workflow publishes into. The build job below installs
# that public tree (`dnf config-manager addrepo --from-repofile=` its
# `freereac.repo`, then imports its key) BEFORE `dnf builddep` runs, so
# libreac-devel resolves from it. If libreac has not yet been published
# there at the required version, `dnf builddep` fails loudly and by name
# ("nothing provides pkgconfig(libreac) >= X") -- that is a correct,
# informative failure of a missing publish, not a bug in this file, and not
# this lane's job to fix.
#
# workflow_dispatch ONLY: no push trigger, ever -- publishing a package is a
# human decision, not a side effect of a commit. The `tag` input names the
# release on the human's word, not on a tag push.
#
# THE SHARED-TREE RACE: libreac's publisher and this one push commits to the
# SAME branch of FreeREAC/freereac.github.io from TWO DIFFERENT REPOSITORIES.
# GitHub's `concurrency:` groups are scoped per-repository, so no group name
# here can serialise against the other repo's run. The mitigation is
# structural, not locking: `git push` itself refuses a non-fast-forward, so a
# genuine race loses to that refusal rather than corrupting the tree, and
# packaging/publish-repo.sh places files by NEVRA (identical package = no-op,
# a new one is ADDED, nothing already in the tree is ever removed) so a
# retried push after a refusal is safe to re-run. Publish a release, wait for
# it to land, then publish the next; the tag input already forces one
# dispatch to name one version.
#
# KEY HONESTY: before signing, the imported RPM_GPG_KEY's fingerprint is
# checked against the fingerprint of the key the public tree already
# publishes (rpm/RPM-GPG-KEY-freereac). A mismatch refuses the run rather
# than sign with a key repo_gpgcheck=1 clients would then fail to verify
# against the key line their .repo file actually carries.

name: Release reac-pw RPM to the dnf repo

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build (must already exist and match v[0-9]*, e.g. v0.5.3)'
        required: true
      sign:
        description: 'Sign the package and the repo metadata. false runs publish-repo.sh --no-sign for a dry run that publishes nothing.'
        type: boolean
        default: false

concurrency:
  # Serialises repeat dispatches of THIS workflow only -- see the race note above
  # for why it cannot reach across repositories.
  group: release-rpm-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build reac-pw RPM (fc44, x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: fedora:44
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Refuse a tag that is not a RELEASE tag
        # Same glob openmixer's build-rpm.sh enforces on its own tags
        # (RELEASE_TAG_GLOB='v[0-9]*'): a work marker becoming the published
        # version has already happened once (openmixer #370) and RPM has no
        # downgrade path. Refusing here names the reason before any build runs.
        run: |
          set -eu
          case "$RELEASE_TAG" in
            v[0-9]*) echo "release tag: $RELEASE_TAG" ;;
            *) echo "::error::'$RELEASE_TAG' does not match the release-tag glob v[0-9]*"; exit 1 ;;
          esac

      # actions/checkout needs git INSIDE the container or it falls back to a tarball with no .git —
      # then `git describe` finds no repository. Install git before the checkout, as openmixer does.
      - name: git for the checkout
        run: dnf install -y -q git rsync # rsync: packaging/make-tarball.sh copies the source tree with it

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ env.RELEASE_TAG }}

      - name: Install the public dnf tree (for pkgconfig(libreac) etc.)
        # `dnf builddep` below resolves reac-pw.spec's BuildRequires against
        # whatever repos are configured -- Fedora's own for meson/ninja/
        # pipewire-devel, and THIS one for pkgconfig(libreac), which only the
        # public FreeREAC tree carries. libreac's own equivalent workflow
        # must have published the required version into
        # https://freereac.github.io/rpm BEFORE this one runs (see the file
        # header, ORDER); if it has not, `dnf builddep` fails loud and by
        # name ("nothing provides pkgconfig(libreac) >= X") -- that is a
        # correct failure of a missing publish, not a bug in this file.
        # `--from-repofile` reads the tree's own freereac.repo unmodified --
        # $releasever/$basearch baseurl, gpgcheck=1/repo_gpgcheck=1 -- so
        # this step can never drift from what the tree actually declares
        # about itself. `rpm --import` makes the key trusted before
        # `dnf builddep -y` runs unattended (an unimported key would
        # otherwise stall on an interactive confirmation prompt).
        run: |
          set -eu
          dnf install -y --setopt=install_weak_deps=False dnf5-plugins
          dnf config-manager addrepo --from-repofile=https://freereac.github.io/rpm/freereac.repo
          rpm --import https://freereac.github.io/rpm/RPM-GPG-KEY-freereac

      - name: Install build dependencies (dnf builddep against the spec)
        run: |
          set -o pipefail
          dnf install -y --setopt=install_weak_deps=False git rpm-build rpmdevtools
          dnf builddep -y packaging/reac-pw.spec
          # Nothing in this job installs the BUILT reac-pw package itself (the
          # RPM is only assembled and uploaded as an artifact), so the spec's
          # runtime Requires (pipewire, from Fedora's own repos) never need
          # this repo file again after builddep -- there is no second
          # `dnf install` of runtime deps in this workflow to place it before.

      - name: Verify the tag resolves to the version this build will publish
        run: |
          set -o pipefail
          # The checkout is owned by a different uid than the container's shell;
          # without this git refuses the repository ("dubious ownership") and
          # `git describe` reports no tag at all.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git describe --tags --match 'v[0-9]*' || { echo '::error::git describe failed — see above'; exit 1; }

      - name: Build the reac-pw RPM
        # packaging/build-rpm.sh single-sources the version from meson.build
        # unless passed one; strip the leading v so the RPM Version: field never
        # carries it (rpm versions do not take a leading 'v').
        run: |
          set -o pipefail
          V="${RELEASE_TAG#v}"
          packaging/build-rpm.sh "$V"

      - name: Show what was built, and refuse an empty build
        run: |
          set -o pipefail
          TOP=$(readlink -f "${RPM_TOPDIR:-$HOME/rpmbuild}")
          find "$TOP/RPMS" "$TOP/SRPMS" -name '*.rpm' | sort | tee /tmp/built.txt
          # A publish step over an empty directory succeeds and publishes
          # nothing (false-signals #1: a search that finds nothing may be a
          # broken search) -- count before trusting the emptiness.
          test -s /tmp/built.txt || { echo "::error::no RPM was produced"; exit 1; }
          echo "RPM_TOPDIR=$TOP" >> "$GITHUB_ENV"

      # THE PACKAGES ARE PUBLIC, OR THEY ARE NOT PUBLISHED. A run artefact expires in
      # thirty days and needs a GitHub login to fetch; a Release asset does not. The dnf
      # tree above is the supported way to install, and this is the way that works with
      # nothing configured — `gh release download`, or a browser. Tag builds only, and it
      # is idempotent: --clobber replaces an asset the same tag already carries rather
      # than failing a re-run.
      - name: attach the packages to the release
        # A release is a dispatched TAG input (the tree publish runs the same way), not a
        # tag push: github.ref is the branch the workflow file came from.
        if: startsWith(inputs.tag, 'v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # the build container is bare fedora: the GitHub CLI is a package there
          command -v gh >/dev/null || dnf install -y -q gh
          TAG="${RELEASE_TAG:-${{ inputs.tag }}}"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "$TAG" --generate-notes
          # Count before uploading: an empty glob would upload nothing and say nothing.
          # The build step's topdir is the container home's rpmbuild; RPM_TOPDIR is only set
          # when a caller overrides it, so look in both (measured: "no RPM to attach", 2026-09-09).
          find "${RPM_TOPDIR:-$HOME/rpmbuild}" /github/home/rpmbuild "$HOME/rpmbuild" -name '*.rpm' 2>/dev/null | sort -u | tee /tmp/assets.txt
          test -s /tmp/assets.txt || { echo "::error::no RPM to attach"; exit 1; }
          gh release upload "$TAG" --clobber $(cat /tmp/assets.txt | tr '\n' ' ')
          # and the source tarball the RPM was built from
          T=$(find "$RPM_TOPDIR/SOURCES" -name 'reac-pw-*.tar.gz' | head -1)
          [ -n "$T" ] && gh release upload "$TAG" --clobber "$T"
          echo "attached to $TAG:"; cat /tmp/assets.txt

      - uses: actions/upload-artifact@v4
        with:
          name: reac-pw-rpm-fc44-x86_64
          path: |
            ${{ env.RPM_TOPDIR }}/RPMS/**/*.rpm
            ${{ env.RPM_TOPDIR }}/SRPMS/*.rpm
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Sign and publish into the public dnf repo tree
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: fedora:44
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      # Signing is asked for, never assumed -- the default dispatch is a dry
      # run, same shape as openmixer's own workflow.
      SIGN: ${{ inputs.sign }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - name: Install packaging tools
        # git: this job's own checkout below works without it (actions/checkout falls back to a
        # tarball), but the public-pages checkout further down has to commit and push, which the
        # tarball fallback cannot do. curl: fetches the public tree's own key, to check it before
        # signing with it (see "Verify the signing key" below).
        run: dnf install -y --setopt=install_weak_deps=False createrepo_c rpm-sign gnupg2 pinentry findutils git curl

      - uses: actions/download-artifact@v4
        with:
          pattern: reac-pw-rpm-*
          merge-multiple: true
          path: collected/

      - name: Prove the artifacts arrived before anything signs them
        run: |
          set -o pipefail
          find collected -name '*.rpm' | sort | tee /tmp/collected.txt
          test -s /tmp/collected.txt || { echo "::error::no RPM was downloaded from the build job"; exit 1; }

      - name: Import the signing key
        if: env.SIGN == 'true'
        env:
          # Named, never valued -- the SAME key libreac's own publisher signs
          # with; two different signing keys over one repo's metadata would
          # make repo_gpgcheck=1 fail for whichever half a client fetches
          # second, since only one gpgkey= line is baked into the .repo file.
          GPG_KEY: ${{ secrets.RPM_GPG_KEY }}
          GPG_PASSPHRASE: ${{ secrets.RPM_GPG_PASSPHRASE }}
        run: |
          set -o pipefail
          test -n "$GPG_KEY" || { echo "::error::RPM_GPG_KEY is not set; a signed publish cannot proceed"; exit 1; }
          printf '%s\n' "$GPG_KEY" | gpg --batch --import
          KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/ {print $10; exit}')
          test -n "$KEY_ID" || { echo "::error::no secret key imported from RPM_GPG_KEY"; exit 1; }
          echo "OMX_GPG_KEY_ID=$KEY_ID" >> "$GITHUB_ENV"
          mkdir -p ~/.gnupg && chmod 700 ~/.gnupg
          echo 'allow-loopback-pinentry' >> ~/.gnupg/gpg-agent.conf
          echo 'pinentry-mode loopback'  >> ~/.gnupg/gpg.conf
          printf '%s' "$GPG_PASSPHRASE" > ~/.gnupg/passphrase
          chmod 600 ~/.gnupg/passphrase
          echo "passphrase-file $HOME/.gnupg/passphrase" >> ~/.gnupg/gpg.conf
          gpgconf --kill gpg-agent || true

      - name: Verify the signing key matches the public tree's published key
        # KEY HONESTY (see the file header): RPM_GPG_KEY is a secret nobody here
        # can read directly, so its identity is proved the only honest way --
        # by fingerprint, against the key the tree it will sign INTO already
        # publishes. A mismatch means this run would sign packages with a key
        # repo_gpgcheck=1 clients cannot verify (the .repo's gpgkey= line still
        # points at the OLD key) -- refuse before a single package is signed,
        # not after a push nobody can undo.
        if: env.SIGN == 'true'
        run: |
          set -o pipefail
          PUB_FPR=$(curl -fsSL https://freereac.github.io/rpm/RPM-GPG-KEY-freereac \
            | gpg --batch --with-colons --dry-run --import-options import-show --import 2>/dev/null \
            | awk -F: '/^fpr:/ {print $10; exit}')
          test -n "$PUB_FPR" || { echo "::error::could not read a fingerprint from https://freereac.github.io/rpm/RPM-GPG-KEY-freereac"; exit 1; }
          if [ "$PUB_FPR" != "$OMX_GPG_KEY_ID" ]; then
            echo "::error::RPM_GPG_KEY (imported fingerprint $OMX_GPG_KEY_ID) does not match the public"
            echo "::error::tree's published key (fingerprint $PUB_FPR) -- refusing to sign. Either the wrong"
            echo "::error::secret is set, or the public tree's key has rotated and RPM_GPG_KEY has not."
            exit 1
          fi
          echo "signing key matches the public tree's key: $OMX_GPG_KEY_ID"

      - name: Require the public-pages token before touching the public tree
        # Fails loud and BY NAME: a missing secret must never fall back to an unauthenticated
        # checkout (read-only, so the later push would fail anonymously with no clue why) or,
        # worse, skip the public publish without saying so.
        if: env.SIGN == 'true'
        env:
          FREEREAC_PAGES_TOKEN: ${{ secrets.FREEREAC_PAGES_TOKEN }}
        run: |
          test -n "$FREEREAC_PAGES_TOKEN" || {
            echo "::error::FREEREAC_PAGES_TOKEN is not set -- create a fine-grained PAT with"
            echo "::error::contents:write on FreeREAC/freereac.github.io and add it as a repository secret."
            exit 1
          }

      - name: Checkout the public pages tree (FreeREAC/freereac.github.io)
        if: env.SIGN == 'true'
        uses: actions/checkout@v4
        with:
          repository: FreeREAC/freereac.github.io
          ref: main
          token: ${{ secrets.FREEREAC_PAGES_TOKEN }}
          path: freereac-pages

      - name: Publish into the public dnf tree, in place (never wiped)
        # No --repo-id/--repo-name/--base-url override: the checkout already carries
        # freereac.repo and RPM-GPG-KEY-freereac from its first hand publish, and the script's
        # own built-in defaults are exactly those values, so this run merges into them instead
        # of emitting a second, colliding .repo/key pair.
        if: env.SIGN == 'true'
        run: |
          set -o pipefail
          packaging/publish-repo.sh --rpm-dir collected --out freereac-pages --key-id "$OMX_GPG_KEY_ID"

      - name: Show what was published
        if: env.SIGN == 'true'
        run: |
          set -o pipefail
          echo "reac-pw packages in the public tree:"
          find freereac-pages/rpm -name 'reac-pw-*.rpm' -o -name 'reac-pw-*.src.rpm' | sort
          echo
          echo "every package now in the tree (reac-pw's addition should be new here):"
          find freereac-pages/rpm/fedora -name '*.rpm' | sort
          echo
          echo "repodata timestamps:"
          find freereac-pages/rpm -name repomd.xml | sort | xargs -r ls -l

      - name: Commit and push the public tree
        if: env.SIGN == 'true'
        run: |
          set -o pipefail
          cd freereac-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- rpm/
          if git diff --cached --quiet -- rpm/; then
            echo "public tree already carries everything $RELEASE_TAG built -- nothing to commit"
          else
            git commit -m "reac-pw $RELEASE_TAG: publish to the public dnf tree" -- rpm/
            git push origin main
          fi

      - name: Assemble an UNSIGNED smoke tree (dry run only, never published)
        # sign=false never touches freereac-pages at all (no checkout above ran) -- this
        # gives the dry run something to inspect anyway, same shape as before: an
        # unsigned local tree, uploaded as an artifact, that proves the build+collect
        # halves worked without publishing or writing to the shared repo.
        if: env.SIGN != 'true'
        run: |
          set -o pipefail
          packaging/publish-repo.sh --rpm-dir collected --out tree --no-sign

      - uses: actions/upload-artifact@v4
        if: env.SIGN != 'true'
        with:
          name: reac-pw-dnf-tree
          path: tree/**
          if-no-files-found: error
          retention-days: 30

      - name: Report a dry run honestly
        if: env.SIGN != 'true'
        # WARNS and exits 0: the build and the unsigned tree assembly both did real work
        # (the artifact above is the proof), and this step exists so the run never
        # CLAIMS to have published when it did not.
        run: |
          echo "::warning::sign=false (the default): this is a dry run, nothing was published."
          echo "publish-repo.sh --no-sign emits repo_gpgcheck=0, and pushing that tree would make"
          echo "a client trust unverified metadata -- so it stays local to this run."
          echo "the assembled unsigned tree is attached to this run as 'reac-pw-dnf-tree' for inspection."
