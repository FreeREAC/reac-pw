name: release

# Packages through the shared release workflows of Open-Mixer/.github. A tag v<version> that is the Version of
# packaging/reac-pw.spec builds signed RPMs (Fedora 45, x86_64 and
# aarch64) and DEBs (Debian bookworm and trixie, amd64 and arm64), publishes them to the FreeREAC channel (FreeREAC/freereac.github.io, signed by its one key) and
# attaches them to the GitHub release, whose notes are the git log since the previous tag. Any other run, a pull request or a branch,
# is a dry run: it builds and lints everything and publishes nothing.
#
# libreac and libreac-transport are build dependencies and come from the channel, so a release of the libreac
# version meson.build asks for comes first; until it is published the builds below stop at installing them.

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: read

jobs:
  rpm:
    uses: Open-Mixer/.github/.github/workflows/build-rpm.yml@openmixer-v1
    with:
      package-name: reac-pw
      target-repo: FreeREAC/freereac.github.io
      base-url: https://freereac.github.io
      release-package: freereac-release
      committed-keys: false
      signing-fingerprint: ${{ vars.FREEREAC_RELEASE_KEY_FPR }}
      key-file: RPM-GPG-KEY-freereac
      repo-file: packaging/freereac-release/freereac.repo
      publish: ${{ github.ref_type == 'tag' }}
      needs-mod-host: false
    secrets:
      OPENMIXER_PACKAGES_SIGNING_KEY: ${{ secrets.FREEREAC_PACKAGES_SIGNING_KEY }}
      PACKAGES_SIGNING_PASSPHRASE: ${{ secrets.FREEREAC_PACKAGES_SIGNING_PASSPHRASE }}
      PAGES_TOKEN: ${{ secrets.FREEREAC_PAGES_TOKEN }}
      SITE_GPG_KEY: ${{ secrets.OPENMIXER_CI_SIGNING_KEY }}
      DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}

  # after the RPMs: a release is one wave. A red or skipped RPM job skips this one, so no DEB is published after a
  # failed RPM.
  deb:
    needs: rpm
    uses: Open-Mixer/.github/.github/workflows/build-deb.yml@openmixer-v1
    with:
      package-name: reac-pw
      target-repo: FreeREAC/freereac.github.io
      base-url: https://freereac.github.io
      release-package: freereac-release
      committed-keys: false
      signing-fingerprint: ${{ vars.FREEREAC_RELEASE_KEY_FPR }}
      key-file: freereac.asc
      label: FreeREAC
      publish: ${{ github.ref_type == 'tag' }}
      dependencies: ''
      requires: libreac7 libreac-transport7
    secrets:
      OPENMIXER_PACKAGES_SIGNING_KEY: ${{ secrets.FREEREAC_PACKAGES_SIGNING_KEY }}
      PACKAGES_SIGNING_PASSPHRASE: ${{ secrets.FREEREAC_PACKAGES_SIGNING_PASSPHRASE }}
      PAGES_TOKEN: ${{ secrets.FREEREAC_PAGES_TOKEN }}
      SITE_GPG_KEY: ${{ secrets.OPENMIXER_CI_SIGNING_KEY }}
      DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
